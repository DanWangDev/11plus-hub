services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hub-backend
    restart: unless-stopped
    command: >
      sh -c "node dist/db/migrate.js up && node dist/db/seed.js && node dist/server.js"
    ports:
      - '3009:3009'
    networks:
      - default
      - labf-net
    environment:
      NODE_ENV: development
      PORT: 3009
      DB_HOST: labf-db
      DB_PORT: 5432
      DB_NAME: hub
      DB_USER: hub
      DB_PASSWORD: hub_dev_password
      OIDC_ISSUER: http://localhost:3009
      CORS_ORIGIN: http://localhost:3009
      LOG_LEVEL: debug
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@labf.app}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}

# Shared cross-app network. Backend joins to reach labf-db.
# Created once via labf-infra/bootstrap.sh.
networks:
  labf-net:
    external: true
    name: labf-net
