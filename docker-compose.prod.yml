services:
  backend:
    image: ghcr.io/danwangdev/11plus-hub-backend:latest
    container_name: hub-backend
    restart: unless-stopped
    command: >
      sh -c "node dist/db/migrate.js up && node dist/db/seed.js && node dist/server.js"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: labf-db
      DB_PORT: 5432
    # Bound to loopback only: the frontend nginx reaches the backend over
    # the compose network (backend:3009). Exposing 3009 on the LAN let any
    # device hit the API directly and spoof X-Forwarded-* headers to bypass
    # IP-based rate limiting (trust proxy is on for the Cloudflare/nginx hop).
    ports:
      - '127.0.0.1:3009:3009'
    networks:
      - default
      - labf-net

  frontend:
    image: ghcr.io/danwangdev/11plus-hub-frontend:latest
    container_name: hub-frontend
    restart: unless-stopped
    ports:
      - '3010:80'
    networks:
      - default

  # One-time user migration from SQLite databases
  # Usage:
  #   1. Place vocab-master.db and writing-buddy.db in ./data/
  #   2. docker compose -f docker-compose.prod.yml --profile migration run --rm migrate-users
  migrate-users:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hub-migrate
    command: >
      sh -c "node dist/db/migrate-users.js
      --vocab-master /data/vocab-master.db
      --writing-buddy /data/writing-buddy.db"
    env_file: .env
    environment:
      DB_HOST: labf-db
      DB_PORT: 5432
    volumes:
      - ${MIGRATION_DATA_DIR:-./data}:/data:ro
    profiles:
      - migration
    networks:
      - default

networks:
  labf-net:
    external: true
    name: labf-net
